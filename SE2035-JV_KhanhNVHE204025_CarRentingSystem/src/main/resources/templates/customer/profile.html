<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/customer-layout :: layout(title='Hồ sơ', content=~{::content})}">
<body>
<div th:fragment="content" class="d-flex justify-content-center align-items-center py-4">
    <div class="card card-flat shadow" style="width: 100%; max-width: 600px;">
        <div class="card-body p-5">
            <div class="text-center mb-5">
                <div class="d-inline-flex justify-content-center align-items-center rounded-circle mb-3" 
                     style="width: 80px; height: 80px; border: 2px solid var(--gold); background: rgba(255,255,255,0.03); font-size: 2rem; color: var(--gold); font-weight: 500;">
                     <span th:text="${customer.fullName != null and !#strings.isEmpty(customer.fullName)} ? ${#strings.substring(customer.fullName, 0, 1).toUpperCase()} : 'U'">U</span>
                </div>
                <h4 class="fw-normal mb-1 text-white" th:text="${customer.fullName}"></h4>
                <p class="text-muted small mb-0" th:text="${customer.account.email}"></p>
            </div>
            
            <div class="d-flex flex-column gap-3 mb-4">
                <div class="d-flex justify-content-between pb-2 border-bottom border-secondary-subtle" style="--bs-border-opacity: 0.15;">
                    <span class="text-muted small">Số điện thoại</span>
                    <span class="fw-medium text-light" th:text="${customer.mobile}"></span>
                </div>
                <div class="d-flex justify-content-between pb-2 border-bottom border-secondary-subtle" style="--bs-border-opacity: 0.15;">
                    <span class="text-muted small">Ngày sinh</span>
                    <span class="fw-medium text-light" th:text="${customer.birthday}"></span>
                </div>
                <div class="d-flex justify-content-between pb-2 border-bottom border-secondary-subtle" style="--bs-border-opacity: 0.15;">
                    <span class="text-muted small">CCCD / Hộ chiếu</span>
                    <span class="fw-medium text-light" th:text="${customer.identityCard}"></span>
                </div>
                <div class="d-flex justify-content-between pb-2 border-bottom border-secondary-subtle" style="--bs-border-opacity: 0.15;">
                    <span class="text-muted small">Số bằng lái xe</span>
                    <span class="fw-medium text-light" th:text="${customer.licenceNumber}"></span>
                </div>
                <div class="d-flex justify-content-between pb-2 border-bottom border-secondary-subtle" style="--bs-border-opacity: 0.15;">
                    <span class="text-muted small">Ngày cấp bằng</span>
                    <span class="fw-medium text-light" th:text="${customer.licenceDate}"></span>
                </div>
            </div>
            
            <div class="text-center mt-5">
                <a th:href="@{/customer/profile/edit}" class="btn btn-minimal py-2 px-5 w-100">Sửa thông tin cá nhân</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
