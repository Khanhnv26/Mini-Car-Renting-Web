<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/admin-layout :: layout(title='Quản lý giao dịch', content=~{::content})}">
<body>
<div th:fragment="content" class="px-2">
    <div class="mb-4">
        <h1 class="app-page-title mb-0">Danh sách giao dịch thuê</h1>
    </div>

    <div class="card card-flat p-4 mb-4">
        <form th:action="@{/admin/rentals}" method="get" class="row g-3">
            <div class="col-md-3">
                <input type="text" name="keyword" class="form-control form-control-sm"
                       placeholder="Tên khách hàng hoặc tên xe..." th:value="${keyword}" />
            </div>
            <div class="col-md-2">
                <select name="status" class="form-select form-select-sm">
                    <option value="" th:selected="${selectedStatus == null or selectedStatus == ''}">-- Tất cả --</option>
                    <option value="Pending" th:selected="${selectedStatus == 'Pending'}">Chờ xử lý</option>
                    <option value="Renting" th:selected="${selectedStatus == 'Renting'}">Đang thuê</option>
                    <option value="Completed" th:selected="${selectedStatus == 'Completed'}">Đã hoàn thành</option>
                    <option value="Cancelled" th:selected="${selectedStatus == 'Cancelled'}">Đã hủy</option>
                </select>
            </div>
            <div class="col-md-2">
                <input type="date" name="startDate" class="form-control form-control-sm" placeholder="Từ ngày..." th:value="${startDate}" />
            </div>
            <div class="col-md-2">
                <input type="date" name="endDate" class="form-control form-control-sm" placeholder="Đến ngày..." th:value="${endDate}" />
            </div>
            <div class="col-md-2 d-grid">
                <button type="submit" class="btn btn-minimal py-1">Lọc</button>
            </div>
        </form>
    </div>
    
    <div class="card card-flat p-0 overflow-hidden">
        <div th:if="${rentals == null or #lists.isEmpty(rentals)}" class="empty-state">
            <h5 class="fw-light"
                th:text="${(selectedStatus != null and selectedStatus != '') or startDate != null or endDate != null or (keyword != null and !#strings.isEmpty(keyword))}
                    ? 'Không tìm thấy giao dịch phù hợp' : 'Chưa có giao dịch nào'">Chưa có giao dịch nào</h5>
            <p class="text-muted small mb-0"
               th:text="${(selectedStatus != null and selectedStatus != '') or startDate != null or endDate != null or (keyword != null and !#strings.isEmpty(keyword))}
                    ? 'Thử đổi bộ lọc hoặc xóa điều kiện tìm kiếm.' : 'Khi khách hàng đặt thuê xe, danh sách sẽ xuất hiện tại đây.'">…</p>
        </div>
        
        <div th:unless="${rentals == null or #lists.isEmpty(rentals)}" class="table-responsive">
            <table class="table table-minimal mb-0">
                <thead>
                <tr>
                     <th class="text-muted" style="width: 4rem;">STT</th>
                     <th>Khách hàng</th>
                    <th>Xe</th>
                    <th><a class="text-decoration-none text-dark" th:href="@{/admin/rentals(page=${currentPage}, status=${selectedStatus}, startDate=${startDate}, endDate=${endDate}, keyword=${keyword}, sortBy='pickupDate', sortDir=${reverseSortDir})}">Ngày nhận <span th:if="${sortBy == 'pickupDate'}" th:text="${sortDir == 'asc' ? '↑' : '↓'}"></span></a></th>
                    <th><a class="text-decoration-none text-dark" th:href="@{/admin/rentals(page=${currentPage}, status=${selectedStatus}, startDate=${startDate}, endDate=${endDate}, keyword=${keyword}, sortBy='returnDate', sortDir=${reverseSortDir})}">Ngày trả <span th:if="${sortBy == 'returnDate'}" th:text="${sortDir == 'asc' ? '↑' : '↓'}"></span></a></th>
                    <th><a class="text-decoration-none text-dark" th:href="@{/admin/rentals(page=${currentPage}, status=${selectedStatus}, startDate=${startDate}, endDate=${endDate}, keyword=${keyword}, sortBy='rentPrice', sortDir=${reverseSortDir})}">Giá <span th:if="${sortBy == 'rentPrice'}" th:text="${sortDir == 'asc' ? '↑' : '↓'}"></span></a></th>
                    <th><a class="text-decoration-none text-dark" th:href="@{/admin/rentals(page=${currentPage}, status=${selectedStatus}, startDate=${startDate}, endDate=${endDate}, keyword=${keyword}, sortBy='status', sortDir=${reverseSortDir})}">Trạng thái <span th:if="${sortBy == 'status'}" th:text="${sortDir == 'asc' ? '↑' : '↓'}"></span></a></th>
                    <th class="text-end">Cập nhật</th>
                </tr>
                </thead>
                <tbody>
                 <tr th:each="r, iterStat : ${rentals}">
                     <td class="text-muted" th:text="${currentPage * pageSize + iterStat.count}"></td>
                     <td class="fw-medium" th:text="${r.customer != null ? r.customer.fullName : '—'}"></td>
                    <td th:text="${r.car != null ? r.car.carName : '—'}"></td>
                    <td th:text="${r.pickupDate}"></td>
                    <td th:text="${r.returnDate}"></td>
                    <td class="text-gold fw-medium" th:text="${r.rentPrice} + '$'"></td>
                    <td>
                        <span th:if="${r.status == 'Pending'}" class="badge badge-soft-gold py-2 px-3 rounded-pill">Chờ xử lý</span>
                        <span th:if="${r.status == 'Renting'}" class="badge badge-soft-blue py-2 px-3 rounded-pill">Đang thuê</span>
                        <span th:if="${r.status == 'Completed'}" class="badge badge-soft-green py-2 px-3 rounded-pill">Đã hoàn thành</span>
                        <span th:if="${r.status == 'Cancelled'}" class="badge badge-soft-gray py-2 px-3 rounded-pill">Đã hủy</span>
                    </td>
                    <td class="text-end action-cell">
                        <div th:if="${r.status == 'Pending'}" class="rental-actions">
                            <form th:action="@{/admin/rentals/status/{id}(id=${r.carRenId})}" method="post">
                                <input type="hidden" name="status" value="Renting"/>
                                <button type="submit" class="btn btn-action-confirm">Xác nhận</button>
                            </form>
                            <form th:action="@{/admin/rentals/status/{id}(id=${r.carRenId})}" method="post">
                                <input type="hidden" name="status" value="Cancelled"/>
                                <button type="submit" class="btn btn-action-cancel">Hủy</button>
                            </form>
                        </div>
                        <div th:if="${r.status == 'Renting'}" class="rental-actions">
                            <form th:action="@{/admin/rentals/status/{id}(id=${r.carRenId})}" method="post">
                                <input type="hidden" name="status" value="Completed"/>
                                <button type="submit" class="btn btn-action-done">Hoàn thành</button>
                            </form>
                            <form th:action="@{/admin/rentals/status/{id}(id=${r.carRenId})}" method="post">
                                <input type="hidden" name="status" value="Cancelled"/>
                                <button type="submit" class="btn btn-action-cancel">Hủy</button>
                            </form>
                        </div>
                        <span th:if="${r.status == 'Completed' or r.status == 'Cancelled'}" class="text-muted rental-action-none">—</span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        
        <div th:if="${totalPages > 1}" class="card-footer d-flex justify-content-between align-items-center py-3">
            <div class="text-muted small">
                Đang hiển thị dòng <span th:text="${currentPage * pageSize + 1}"></span> - <span th:text="${T(java.lang.Math).min((currentPage + 1L) * pageSize, totalItems)}"></span> của tổng số <span th:text="${totalItems}"></span> dòng
            </div>
            <nav aria-label="Page navigation">
                <ul class="pagination pagination-sm pagination-minimal mb-0 gap-1">
                    <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                        <a class="page-link" th:href="@{/admin/rentals(page=0, status=${selectedStatus}, startDate=${startDate}, endDate=${endDate}, keyword=${keyword}, sortBy=${sortBy}, sortDir=${sortDir})}" aria-label="First">&laquo;</a>
                    </li>
                    <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                        <a class="page-link" th:href="@{/admin/rentals(page=${currentPage - 1}, status=${selectedStatus}, startDate=${startDate}, endDate=${endDate}, keyword=${keyword}, sortBy=${sortBy}, sortDir=${sortDir})}" aria-label="Previous">&lsaquo;</a>
                    </li>
                    <li class="page-item" th:each="i : ${#numbers.sequence(T(java.lang.Math).max(0, currentPage - 2), T(java.lang.Math).min(totalPages - 1, currentPage + 2))}" th:classappend="${currentPage == i} ? 'active'">
                        <a class="page-link" th:href="@{/admin/rentals(page=${i}, status=${selectedStatus}, startDate=${startDate}, endDate=${endDate}, keyword=${keyword}, sortBy=${sortBy}, sortDir=${sortDir})}" th:text="${i + 1}"></a>
                    </li>
                    <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                        <a class="page-link" th:href="@{/admin/rentals(page=${currentPage + 1}, status=${selectedStatus}, startDate=${startDate}, endDate=${endDate}, keyword=${keyword}, sortBy=${sortBy}, sortDir=${sortDir})}" aria-label="Next">&rsaquo;</a>
                    </li>
                    <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                        <a class="page-link" th:href="@{/admin/rentals(page=${totalPages - 1}, status=${selectedStatus}, startDate=${startDate}, endDate=${endDate}, keyword=${keyword}, sortBy=${sortBy}, sortDir=${sortDir})}" aria-label="Last">&raquo;</a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
</div>
</body>
</html>
