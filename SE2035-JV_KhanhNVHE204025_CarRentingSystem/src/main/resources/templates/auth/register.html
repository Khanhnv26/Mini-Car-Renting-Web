<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/auth-layout :: layout(title='Đăng ký', content=~{::content})}">
<body>
<div th:fragment="content">
    <div th:if="${error}" class="alert alert-danger border-0 rounded-1 text-center small" th:text="${error}"></div>

    <form th:action="@{/register}" method="post" th:object="${registerForm}">
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label text-muted small mb-1">Tên tài khoản</label>
                <input type="text" th:field="*{accountName}" class="form-control input-minimal py-2" required>
                <div th:if="${#fields.hasErrors('accountName')}" th:errors="*{accountName}" class="text-danger small mt-1"></div>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label text-muted small mb-1">Họ tên</label>
                <input type="text" th:field="*{fullName}" class="form-control input-minimal py-2" required>
                <div th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}" class="text-danger small mt-1"></div>
            </div>
        </div>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label text-muted small mb-1">Email</label>
                <input type="email" th:field="*{email}" class="form-control input-minimal py-2" required>
                <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-danger small mt-1"></div>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label text-muted small mb-1">Mật khẩu</label>
                <input type="password" th:field="*{password}" class="form-control input-minimal py-2" required>
                <div th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="text-danger small mt-1"></div>
            </div>
        </div>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label text-muted small mb-1">Số điện thoại</label>
                <input type="text" th:field="*{mobile}" class="form-control input-minimal py-2" required>
                <div th:if="${#fields.hasErrors('mobile')}" th:errors="*{mobile}" class="text-danger small mt-1"></div>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label text-muted small mb-1">Ngày sinh</label>
                <input type="date" th:field="*{birthday}" class="form-control input-minimal py-2" required th:max="${today}">
                <div th:if="${#fields.hasErrors('birthday')}" th:errors="*{birthday}" class="text-danger small mt-1"></div>
                <div th:errors="*{adult}" class="text-danger small mt-1"></div>
            </div>
        </div>
        <div class="row mb-4">
            <div class="col-md-4 mb-3 mb-md-0">
                <label class="form-label text-muted small mb-1">CCCD</label>
                <input type="text" th:field="*{identityCard}" class="form-control input-minimal py-2" required>
                <div th:if="${#fields.hasErrors('identityCard')}" th:errors="*{identityCard}" class="text-danger small mt-1"></div>
            </div>
            <div class="col-md-4 mb-3 mb-md-0">
                <label class="form-label text-muted small mb-1">Bằng lái xe</label>
                <input type="text" th:field="*{licenceNumber}" class="form-control input-minimal py-2" required>
                <div th:if="${#fields.hasErrors('licenceNumber')}" th:errors="*{licenceNumber}" class="text-danger small mt-1"></div>
            </div>
            <div class="col-md-4">
                <label class="form-label text-muted small mb-1">Ngày cấp bằng</label>
                <input type="date" th:field="*{licenceDate}" class="form-control input-minimal py-2" required th:max="${today}">
                <div th:if="${#fields.hasErrors('licenceDate')}" th:errors="*{licenceDate}" class="text-danger small mt-1"></div>
                <div th:errors="*{licenceOnOrAfterAdultAge}" class="text-danger small mt-1"></div>
            </div>
        </div>
        <button type="submit" class="btn btn-minimal w-100 py-2 mt-2">Đăng ký tài khoản</button>
    </form>
    <div class="text-center mt-4">
        <a th:href="@{/login}" class="text-muted text-decoration-none small">Đã có tài khoản? <span class="text-gold">Đăng nhập</span></a>
    </div>
</div>
</body>
</html>
