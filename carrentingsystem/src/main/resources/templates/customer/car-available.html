<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Xe sẵn sàng</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<h1>Danh sách xe có thể thuê</h1>
<a th:href="@{/customer/rent}">Thuê xe</a> |
<a th:href="@{/customer/history}">Lịch sử</a> |
<a th:href="@{/customer/profile}">Profile</a> |
<a th:href="@{/logout}">Đăng xuất</a>
<hr/>
<table border="1">
    <thead>
    <tr>
        <th>Tên xe</th>
        <th>Năm</th>
        <th>Màu</th>
        <th>Sức chứa</th>
        <th>Giá/ngày</th>
        <th>Hãng</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="car : ${cars}">
        <td th:text="${car.carName}"></td>
        <td th:text="${car.carModelYear}"></td>
        <td th:text="${car.color}"></td>
        <td th:text="${car.capacity}"></td>
        <td th:text="${car.rentPrice}"></td>
        <td th:text="${car.carProducer.producerName}"></td>
    </tr>
    </tbody>
</table>
</body>
</html>
