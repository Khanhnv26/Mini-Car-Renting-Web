<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/customer-layout :: layout(title='Đánh giá của tôi', content=~{::content})}">
<body>
<div th:fragment="content">
    <div class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-4">
        <div>
            <h1 class="app-page-title mb-1">Đánh giá của tôi</h1>
            <p class="app-page-sub mb-0">Xem lại các nhận xét bạn đã gửi sau chuyến thuê.</p>
        </div>
        <span class="badge badge-soft-gold rounded-pill px-3 py-2" th:if="${totalItems != null}">
            <span th:text="${totalItems}">0</span> đánh giá
        </span>
    </div>

    <div class="card card-flat p-4 mb-4">
        <form th:action="@{/customer/reviews}" method="get" class="row g-3 align-items-end">
            <div class="col-md-3">
                <label class="form-label text-muted small mb-1">Số sao</label>
                <select name="star" class="form-select form-select-sm">
                    <option value="" th:selected="${selectedStar == null}">Tất cả</option>
                    <option value="5" th:selected="${selectedStar == 5}">5 sao</option>
                    <option value="4" th:selected="${selectedStar == 4}">4 sao</option>
                    <option value="3" th:selected="${selectedStar == 3}">3 sao</option>
                    <option value="2" th:selected="${selectedStar == 2}">2 sao</option>
                    <option value="1" th:selected="${selectedStar == 1}">1 sao</option>
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label text-muted small mb-1">Tìm kiếm</label>
                <input type="text" name="keyword" class="form-control form-control-sm"
                       placeholder="Nội dung hoặc tên xe..." th:value="${keyword}">
            </div>
            <div class="col-md-3 d-grid">
                <button type="submit" class="btn btn-minimal py-1">Lọc</button>
            </div>
        </form>
    </div>

    <div th:if="${reviews == null or #lists.isEmpty(reviews)}" class="empty-state py-5 text-center card card-flat">
        <h5 class="fw-light"
            th:text="${selectedStar != null or (keyword != null and !#strings.isEmpty(keyword))}
                ? 'Không tìm thấy đánh giá phù hợp' : 'Bạn chưa có đánh giá nào'">Bạn chưa có đánh giá nào</h5>
        <p class="text-muted small mb-3"
           th:text="${selectedStar != null or (keyword != null and !#strings.isEmpty(keyword))}
                ? 'Thử đổi bộ lọc hoặc xóa điều kiện tìm kiếm.' : 'Hoàn thành chuyến thuê rồi viết đánh giá trong Lịch sử.'">…</p>
        <a th:if="${selectedStar != null or (keyword != null and !#strings.isEmpty(keyword))}"
           th:href="@{/customer/reviews}" class="btn btn-minimal btn-sm px-4">Xóa lọc</a>
        <a th:unless="${selectedStar != null or (keyword != null and !#strings.isEmpty(keyword))}"
           th:href="@{/customer/history}" class="btn btn-minimal btn-sm px-4">Xem lịch sử</a>
    </div>

    <div th:unless="${reviews == null or #lists.isEmpty(reviews)}" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
        <div th:each="r : ${reviews}" class="col">
            <div class="card card-flat h-100 review-card">
                <div class="card-body d-flex flex-column">
                    <div class="d-flex justify-content-between align-items-start gap-2 mb-2">
                        <span class="badge badge-soft-gold rounded-pill"
                              th:text="${r.reviewStar + ' sao'}">5 sao</span>
                    </div>
                    <p class="text-light mb-3 review-comment" th:text="${r.comment}">Comment</p>
                    <div class="mt-auto pt-2 border-top border-secondary border-opacity-25">
                        <div class="small text-white"
                             th:text="${r.carRental != null and r.carRental.car != null ? r.carRental.car.carName : '—'}">Car</div>
                        <div class="small text-muted"
                             th:if="${r.carRental != null}">
                            <span th:text="${r.carRental.pickupDate}"></span>
                            <span class="opacity-50"> → </span>
                            <span th:text="${r.carRental.returnDate}"></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:if="${totalPages > 1}" class="fleet-pagination mt-4">
        <div class="fleet-pagination-meta">
            Trang <strong th:text="${currentPage + 1}">1</strong>
            /
            <strong th:text="${totalPages}">1</strong>
            <span class="fleet-pagination-dot">·</span>
            <span th:text="${totalItems}">0</span> đánh giá
        </div>
        <nav aria-label="Page navigation">
            <ul class="pagination pagination-sm pagination-minimal fleet-page-nav mb-0 gap-1">
                <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                    <a class="page-link" th:href="@{/customer/reviews(page=0, star=${selectedStar}, keyword=${keyword})}" aria-label="First">&laquo;</a>
                </li>
                <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                    <a class="page-link" th:href="@{/customer/reviews(page=${currentPage - 1}, star=${selectedStar}, keyword=${keyword})}" aria-label="Previous">&lsaquo;</a>
                </li>
                <li class="page-item"
                    th:each="i : ${#numbers.sequence(T(java.lang.Math).max(0, currentPage - 2), T(java.lang.Math).min(totalPages - 1, currentPage + 2))}"
                    th:classappend="${currentPage == i} ? 'active'">
                    <a class="page-link" th:href="@{/customer/reviews(page=${i}, star=${selectedStar}, keyword=${keyword})}" th:text="${i + 1}"></a>
                </li>
                <li class="page-item" th:classappend="${currentPage >= totalPages - 1} ? 'disabled'">
                    <a class="page-link" th:href="@{/customer/reviews(page=${currentPage + 1}, star=${selectedStar}, keyword=${keyword})}" aria-label="Next">&rsaquo;</a>
                </li>
                <li class="page-item" th:classappend="${currentPage >= totalPages - 1} ? 'disabled'">
                    <a class="page-link" th:href="@{/customer/reviews(page=${totalPages - 1}, star=${selectedStar}, keyword=${keyword})}" aria-label="Last">&raquo;</a>
                </li>
            </ul>
        </nav>
    </div>
</div>
</body>
</html>
