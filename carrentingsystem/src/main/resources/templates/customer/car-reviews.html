<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/customer-layout :: layout(title='Đánh giá xe', content=~{::content})}">
<body>
<div th:fragment="content" class="max-w-4xl mx-auto">
    <div class="mb-4">
        <a th:if="${returnCarIds != null and !#lists.isEmpty(returnCarIds)}"
           th:href="@{/customer/rent(carIds=${returnCarIds})}"
           class="btn btn-ghost px-0">&larr; Quay lại đăng ký thuê</a>
        <a th:unless="${returnCarIds != null and !#lists.isEmpty(returnCarIds)}"
           th:href="@{/customer/cars}"
           class="btn btn-ghost px-0">&larr; Quay lại danh sách xe</a>
    </div>

    <div class="card card-flat p-4 mb-4" th:if="${selectedCar != null}">
        <div class="d-flex flex-wrap justify-content-between align-items-start gap-3">
            <div>
                <h1 class="app-page-title mb-1" th:text="${selectedCar.carName}">Xe</h1>
                <p class="app-page-sub mb-0">
                    <span th:text="${selectedCar.rentPrice + ' $/ngày'}"></span>
                    <span class="opacity-50"> · </span>
                    <span th:text="${selectedCar.status}"></span>
                </p>
            </div>
            <div class="text-end" th:if="${reviewCount != null and reviewCount > 0}">
                <div class="review-stars mb-1">
                    <span th:each="i : ${#numbers.sequence(1, 5)}"
                          th:classappend="${i <= avgStarRounded} ? ' star-on' : ' star-off'"
                          class="review-star">★</span>
                </div>
                <span class="small text-muted"
                      th:text="${#numbers.formatDecimal(avgStar, 1, 1) + ' / 5 · ' + reviewCount + ' đánh giá'}"></span>
            </div>
            <div class="text-end" th:if="${reviewCount == null or reviewCount == 0}">
                <span class="small text-muted">Chưa có đánh giá</span>
            </div>
        </div>
        <div class="mt-3">
            <a th:if="${returnCarIds != null and !#lists.isEmpty(returnCarIds)}"
               th:href="@{/customer/rent(carIds=${returnCarIds}, carId=${selectedCar.carId})}"
               class="btn btn-minimal py-2 px-4">Thuê xe này</a>
            <a th:unless="${returnCarIds != null and !#lists.isEmpty(returnCarIds)}"
               th:href="@{/customer/rent(carId=${selectedCar.carId})}"
               class="btn btn-minimal py-2 px-4">Thuê xe này</a>
        </div>
    </div>

    <div class="card card-flat p-4">
        <h2 class="h6 text-white mb-3">Đánh giá từ khách hàng</h2>

        <div th:if="${carReviews == null or #lists.isEmpty(carReviews)}" class="empty-state text-center py-5">
            <h5 class="fw-light">Chưa có đánh giá cho xe này</h5>
            <p class="text-muted small mb-0">Chưa có khách hàng nào đánh giá xe này.</p>
        </div>

        <div th:unless="${carReviews == null or #lists.isEmpty(carReviews)}" class="row row-cols-1 row-cols-md-2 g-3">
            <div th:each="r : ${carReviews}" class="col">
                <div class="card card-flat h-100 review-card">
                    <div class="card-body d-flex flex-column">
                        <div class="review-stars mb-2">
                            <span th:each="i : ${#numbers.sequence(1, 5)}"
                                  th:classappend="${i <= r.reviewStar} ? ' star-on' : ' star-off'"
                                  class="review-star">★</span>
                        </div>
                        <p class="text-light mb-3 review-comment small" th:text="${r.comment}">Comment</p>
                        <div class="mt-auto pt-2 border-top border-secondary border-opacity-25">
                            <div class="small text-muted"
                                 th:text="${r.carRental != null and r.carRental.customer != null ? r.carRental.customer.fullName : 'Khách hàng'}">Customer</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
