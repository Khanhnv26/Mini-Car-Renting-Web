<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/customer-layout :: layout(title='Hồ sơ', content=~{::content})}">
<body>
<div th:fragment="content">
    <div class="card card-flat">
        <div class="card-body p-4">
            <h5 class="fw-normal mb-4">Thông tin cá nhân</h5>
            <table class="table table-borderless mb-0" style="max-width: 400px;">
                <tr><td class="text-muted small" style="width: 120px;">Họ tên</td><td th:text="${customer.fullName}"></td></tr>
                <tr><td class="text-muted small">SĐT</td><td th:text="${customer.mobile}"></td></tr>
                <tr><td class="text-muted small">Ngày sinh</td><td th:text="${customer.birthday}"></td></tr>
                <tr><td class="text-muted small">CCCD</td><td th:text="${customer.identityCard}"></td></tr>
                <tr><td class="text-muted small">Bằng lái</td><td th:text="${customer.licenceNumber}"></td></tr>
                <tr><td class="text-muted small">Ngày cấp</td><td th:text="${customer.licenceDate}"></td></tr>
                <tr><td class="text-muted small">Email</td><td th:text="${customer.account.email}"></td></tr>
            </table>
            <a th:href="@{/customer/profile/edit}" class="btn btn-minimal btn-sm py-1 px-3 mt-3">Sửa thông tin</a>
        </div>
    </div>
</div>
</body>
</html>
