<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/admin-layout :: layout(title='Form khách hàng', content=~{::content})}">
<body>
<div th:fragment="content">
    <h1 class="h5 fw-normal mb-3" th:text="${customerDTO.customerId != null} ? 'Sửa khách hàng' : 'Thêm khách hàng'"></h1>
    <a th:href="@{/admin/customers}" class="btn-ghost mb-3 d-inline-block">&larr; Quay lại</a>
    <div th:if="${error}" class="alert alert-danger border-0 rounded-0 small" th:text="${error}"></div>

    <div class="card card-flat p-4">
        <form th:action="@{/admin/customers/save}" th:object="${customerDTO}" method="post" class="row g-3">
            <input type="hidden" th:field="*{customerId}">
            <div class="col-md-6">
                <label class="form-label text-muted small mb-1">Họ tên</label>
                <input th:field="*{fullName}" class="form-control input-minimal py-2">
                <div th:errors="*{fullName}" class="text-danger small mt-1"></div>
            </div>
            <div class="col-md-6">
                <label class="form-label text-muted small mb-1">SĐT</label>
                <input th:field="*{mobile}" class="form-control input-minimal py-2">
                <div th:errors="*{mobile}" class="text-danger small mt-1"></div>
            </div>
            <div class="col-md-4">
                <label class="form-label text-muted small mb-1">Ngày sinh</label>
                <input type="date" th:field="*{birthDate}" class="form-control input-minimal py-2">
                <div th:errors="*{birthDate}" class="text-danger small mt-1"></div>
            </div>
            <div class="col-md-4">
                <label class="form-label text-muted small mb-1">CCCD</label>
                <input th:field="*{identityCard}" class="form-control input-minimal py-2">
                <div th:errors="*{identityCard}" class="text-danger small mt-1"></div>
            </div>
            <div class="col-md-4">
                <label class="form-label text-muted small mb-1">Bằng lái</label>
                <input th:field="*{licenceNumber}" class="form-control input-minimal py-2">
                <div th:errors="*{licenceNumber}" class="text-danger small mt-1"></div>
            </div>
            <div class="col-md-6">
                <label class="form-label text-muted small mb-1">Ngày cấp bằng</label>
                <input type="date" th:field="*{licenceDate}" class="form-control input-minimal py-2">
                <div th:errors="*{licenceDate}" class="text-danger small mt-1"></div>
            </div>
            <div class="col-md-6">
                <label class="form-label text-muted small mb-1">Tài khoản</label>
                <select th:field="*{accountId}" class="form-select input-minimal py-2">
                    <option value="">-- Chọn tài khoản --</option>
                    <option th:each="a : ${accounts}" th:value="${a.accountId}" th:text="${a.email}"></option>
                </select>
                <div th:errors="*{accountId}" class="text-danger small mt-1"></div>
            </div>
            <div class="col-12 mt-4">
                <button type="submit" class="btn btn-minimal py-2 px-5">Lưu</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
