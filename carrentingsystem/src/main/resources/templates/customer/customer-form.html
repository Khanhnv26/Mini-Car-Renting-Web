<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/admin-layout :: layout(title='Form khách hàng', content=~{::content})}">
<body>
<div th:fragment="content">
    <h1 class="h4 mb-3" th:text="${customerDTO.customerId != null} ? 'Sửa khách hàng' : 'Thêm khách hàng'"></h1>
    <a th:href="@{/admin/customers}" class="btn btn-outline-secondary btn-sm mb-3">&larr; Quay lại</a>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <form th:action="@{/admin/customers/save}" th:object="${customerDTO}" method="post" class="row g-3">
        <input type="hidden" th:field="*{customerId}">
        <div class="col-md-6">
            <label class="form-label">Họ tên</label>
            <input th:field="*{fullName}" class="form-control">
            <div th:errors="*{fullName}" class="text-danger small"></div>
        </div>
        <div class="col-md-6">
            <label class="form-label">Số điện thoại</label>
            <input th:field="*{mobile}" class="form-control">
            <div th:errors="*{mobile}" class="text-danger small"></div>
        </div>
        <div class="col-md-4">
            <label class="form-label">Ngày sinh</label>
            <input type="date" th:field="*{birthDate}" class="form-control">
            <div th:errors="*{birthDate}" class="text-danger small"></div>
        </div>
        <div class="col-md-4">
            <label class="form-label">Số CCCD</label>
            <input th:field="*{identityCard}" class="form-control">
            <div th:errors="*{identityCard}" class="text-danger small"></div>
        </div>
        <div class="col-md-4">
            <label class="form-label">Số bằng lái</label>
            <input th:field="*{licenceNumber}" class="form-control">
            <div th:errors="*{licenceNumber}" class="text-danger small"></div>
        </div>
        <div class="col-md-6">
            <label class="form-label">Ngày cấp bằng</label>
            <input type="date" th:field="*{licenceDate}" class="form-control">
            <div th:errors="*{licenceDate}" class="text-danger small"></div>
        </div>
        <div class="col-md-6">
            <label class="form-label">Tài khoản</label>
            <select th:field="*{accountId}" class="form-select">
                <option value="">-- Chọn tài khoản --</option>
                <option th:each="a : ${accounts}" th:value="${a.accountId}" th:text="${a.email}"></option>
            </select>
            <div th:errors="*{accountId}" class="text-danger small"></div>
        </div>
        <div class="col-12">
            <button type="submit" class="btn btn-primary">Lưu</button>
        </div>
    </form>
</div>
</body>
</html>
