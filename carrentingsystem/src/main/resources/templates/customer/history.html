<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/customer-layout :: layout(title='Lịch sử thuê xe', content=~{::content})}">
<body>
<div th:fragment="content" class="max-w-4xl mx-auto">
    <div class="mb-4">
        <ul class="nav nav-tabs border-0">
            <li class="nav-item">
                <a class="nav-link tab-minimal" th:href="@{/customer/profile}">Hồ sơ</a>
            </li>
            <li class="nav-item">
                <a class="nav-link tab-minimal active" th:href="@{/customer/history}">Lịch sử thuê xe</a>
            </li>
        </ul>
    </div>
    
    <div class="card card-flat p-4 mb-4">
        <form th:action="@{/customer/history}" method="get" class="row g-3">
            <div class="col-md-4">
                <select name="status" class="form-select form-select-sm">
                    <option value="">-- Trạng thái --</option>
                    <option value="Pending" th:selected="${selectedStatus == 'Pending'}">Chờ xử lý</option>
                    <option value="Renting" th:selected="${selectedStatus == 'Renting'}">Đang thuê</option>
                    <option value="Completed" th:selected="${selectedStatus == 'Completed'}">Đã hoàn thành</option>
                    <option value="Cancelled" th:selected="${selectedStatus == 'Cancelled'}">Đã hủy</option>
                </select>
            </div>
            <div class="col-md-3">
                <input type="date" name="startDate" class="form-control form-control-sm" placeholder="Từ ngày..." th:value="${startDate}" />
            </div>
            <div class="col-md-3">
                <input type="date" name="endDate" class="form-control form-control-sm" placeholder="Đến ngày..." th:value="${endDate}" />
            </div>
            <div class="col-md-2 d-grid">
                <button type="submit" class="btn btn-minimal py-1">Lọc</button>
            </div>
        </form>
    </div>

    <div class="card card-flat p-4">
        <div th:if="${error}" class="alert alert-danger border-0 rounded-1 text-center small" th:text="${error}"></div>
        
        <div class="table-responsive">
            <table class="table table-minimal">
                <thead>
                <tr>
                    <th><a class="text-decoration-none text-dark" th:href="@{/customer/history(page=${currentPage}, status=${selectedStatus}, startDate=${startDate}, endDate=${endDate}, sortBy='carRentID', sortDir=${reverseSortDir})}">Mã số <span th:if="${sortBy == 'carRentID'}" th:text="${sortDir == 'asc' ? '↑' : '↓'}"></span></a></th>
                    <th>Xe</th>
                    <th><a class="text-decoration-none text-dark" th:href="@{/customer/history(page=${currentPage}, status=${selectedStatus}, startDate=${startDate}, endDate=${endDate}, sortBy='pickUpDate', sortDir=${reverseSortDir})}">Ngày nhận <span th:if="${sortBy == 'pickUpDate'}" th:text="${sortDir == 'asc' ? '↑' : '↓'}"></span></a></th>
                    <th><a class="text-decoration-none text-dark" th:href="@{/customer/history(page=${currentPage}, status=${selectedStatus}, startDate=${startDate}, endDate=${endDate}, sortBy='returnDate', sortDir=${reverseSortDir})}">Ngày trả <span th:if="${sortBy == 'returnDate'}" th:text="${sortDir == 'asc' ? '↑' : '↓'}"></span></a></th>
                    <th><a class="text-decoration-none text-dark" th:href="@{/customer/history(page=${currentPage}, status=${selectedStatus}, startDate=${startDate}, endDate=${endDate}, sortBy='rentPrice', sortDir=${reverseSortDir})}">Giá ($) <span th:if="${sortBy == 'rentPrice'}" th:text="${sortDir == 'asc' ? '↑' : '↓'}"></span></a></th>
                    <th><a class="text-decoration-none text-dark" th:href="@{/customer/history(page=${currentPage}, status=${selectedStatus}, startDate=${startDate}, endDate=${endDate}, sortBy='status', sortDir=${reverseSortDir})}">Trạng thái <span th:if="${sortBy == 'status'}" th:text="${sortDir == 'asc' ? '↑' : '↓'}"></span></a></th>
                    <th>Đánh giá</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="r : ${rentals}">
                    <td th:text="${r.carRentID}"></td>
                    <td th:text="${r.car.carName}"></td>
                    <td th:text="${r.pickUpDate}"></td>
                    <td th:text="${r.returnDate}"></td>
                    <td class="text-gold" th:text="${r.rentPrice}"></td>
                    <td>
                        <span th:if="${r.status == 'Pending'}" class="badge badge-soft-gold py-2 px-3 rounded-pill">Chờ xử lý</span>
                        <span th:if="${r.status == 'Renting'}" class="badge badge-soft-gold py-2 px-3 rounded-pill">Đang thuê</span>
                        <span th:if="${r.status == 'Completed'}" class="badge badge-soft-gray py-2 px-3 rounded-pill">Đã hoàn thành</span>
                        <span th:if="${r.status == 'Cancelled'}" class="badge badge-soft-gray py-2 px-3 rounded-pill">Đã hủy</span>
                    </td>
                    <td>
                        <div th:if="${r.status == 'Completed'}">
                            <form th:action="@{/customer/review}" th:object="${reviewDTO}" method="post" class="d-flex gap-2">
                                <input type="hidden" name="carRentalId" th:value="${r.carRentID}">
                                <select name="reviewStar" class="form-select input-minimal py-1 px-2" style="width: auto;">
                                    <option value="1">1 Sao</option>
                                    <option value="2">2 Sao</option>
                                    <option value="3">3 Sao</option>
                                    <option value="4">4 Sao</option>
                                    <option value="5" selected>5 Sao</option>
                                </select>
                                <input type="text" name="comment" class="form-control input-minimal py-1 px-2" placeholder="Nhận xét..." style="width: auto;">
                                <div th:errors="*{comment}" class="text-danger small"></div>
                                <button type="submit" class="btn btn-minimal py-1 px-3">Gửi</button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        
        <div th:if="${totalPages > 1}" class="card-footer bg-white d-flex justify-content-between align-items-center py-3 px-0 border-top mt-3">
            <div class="text-muted small">
                Đang hiển thị dòng <span th:text="${currentPage * 5 + 1}"></span> - <span th:text="${T(java.lang.Math).min((currentPage + 1) * 5, totalItems)}"></span> của tổng số <span th:text="${totalItems}"></span> dòng
            </div>
            <nav aria-label="Page navigation">
                <ul class="pagination pagination-sm pagination-minimal mb-0">
                    <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                        <a class="page-link" th:href="@{/customer/history(page=0, status=${selectedStatus}, startDate=${startDate}, endDate=${endDate}, sortBy=${sortBy}, sortDir=${sortDir})}">Đầu</a>
                    </li>
                    <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                        <a class="page-link" th:href="@{/customer/history(page=${currentPage - 1}, status=${selectedStatus}, startDate=${startDate}, endDate=${endDate}, sortBy=${sortBy}, sortDir=${sortDir})}">Trước</a>
                    </li>
                    <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}" th:classappend="${currentPage == i} ? 'active'">
                        <a class="page-link" th:href="@{/customer/history(page=${i}, status=${selectedStatus}, startDate=${startDate}, endDate=${endDate}, sortBy=${sortBy}, sortDir=${sortDir})}" th:text="${i + 1}"></a>
                    </li>
                    <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                        <a class="page-link" th:href="@{/customer/history(page=${currentPage + 1}, status=${selectedStatus}, startDate=${startDate}, endDate=${endDate}, sortBy=${sortBy}, sortDir=${sortDir})}">Sau</a>
                    </li>
                    <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                        <a class="page-link" th:href="@{/customer/history(page=${totalPages - 1}, status=${selectedStatus}, startDate=${startDate}, endDate=${endDate}, sortBy=${sortBy}, sortDir=${sortDir})}">Cuối</a>
                    </li>
                </ul>
            </nav>
        </div>
</div>
</body>
</html>
