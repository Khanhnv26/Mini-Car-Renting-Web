<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/customer-layout :: layout(title='Thuê xe', content=~{::content})}">
<body>
<div th:fragment="content" class="max-w-4xl mx-auto">
    <div class="mb-4">
        <a th:href="@{/customer/cars}" class="btn btn-ghost px-0">&larr; Quay lại danh sách xe</a>
    </div>
    <div class="card card-flat p-4">
        <h1 class="app-page-title mb-1">Đăng ký thuê xe</h1>
        <p class="app-page-sub mb-4">Chọn xe, ngày nhận và ngày trả. Giao dịch sẽ ở trạng thái <span class="text-gold">Pending</span> chờ Admin xác nhận.</p>
        <div th:if="${error}" class="alert alert-danger border-0 rounded-1 text-center small" th:text="${error}"></div>
        <form th:action="@{/customer/rent}" th:object="${rentalRequest}" method="post" class="row g-4">
            <div class="col-12">
                <label class="form-label text-muted small mb-1">Chọn xe (có thể chọn nhiều)</label>
                <div th:errors="*{carIds}" class="text-danger small mb-2"></div>
                <div class="list-group rent-car-list" style="max-height: 320px; overflow-y: auto;">
                    <label th:each="car : ${cars}"
                           th:classappend="${rentalRequest.carIds != null and rentalRequest.carIds.contains(car.carId)} ? ' rent-car-selected' : ''"
                           class="list-group-item d-flex align-items-center gap-3 py-2 px-3 border-0 rent-car-item">
                        <input type="checkbox" th:field="*{carIds}" th:value="${car.carId}" class="form-check-input">
                        <span class="flex-grow-1">
                            <span class="d-block text-white" th:text="${car.carName}"></span>
                            <span class="small text-muted"
                                  th:text="${car.rentPrice + '$/ngày · ' + (car.carProducer != null ? car.carProducer.producerName : '—')}"></span>
                        </span>
                        <span th:if="${rentalRequest.carIds != null and rentalRequest.carIds.contains(car.carId)}"
                              class="badge badge-soft-gold rounded-pill small">Đã chọn</span>
                    </label>
                </div>
            </div>
            <div class="col-md-6">
                <label class="form-label text-muted small mb-1">Ngày nhận xe</label>
                <input type="datetime-local" th:field="*{pickupDate}" class="form-control input-minimal py-2">
                <div th:errors="*{pickupDate}" class="text-danger small mt-1"></div>
            </div>
            <div class="col-md-6">
                <label class="form-label text-muted small mb-1">Ngày trả xe</label>
                <input type="datetime-local" th:field="*{returnDate}" class="form-control input-minimal py-2">
                <div th:errors="*{returnDate}" class="text-danger small mt-1"></div>
            </div>
            <div th:errors="*{validDateRange}" class="col-12 text-danger small"></div>
            <div class="col-12 mt-2">
                <button type="submit" class="btn btn-minimal py-2 px-5">Xác nhận đặt thuê</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
