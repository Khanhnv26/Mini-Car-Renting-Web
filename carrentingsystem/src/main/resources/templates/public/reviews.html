<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/public-layout :: layout(title='Đánh giá', content=~{::content})}">
<body>
<div th:fragment="content">
    <section class="pb-5">
        <div class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-4">
            <div>
                <h1 class="h4 fw-light text-white mb-1">Đánh giá từ khách hàng</h1>
                <p class="text-muted small mb-0">Nhận xét sau khi hoàn thành chuyến thuê.</p>
            </div>
            <span class="badge badge-soft-gold rounded-pill px-3 py-2" th:if="${totalItems != null}">
                <span th:text="${totalItems}">0</span> đánh giá
            </span>
        </div>

        <div th:if="${reviews == null or #lists.isEmpty(reviews)}" class="empty-state py-5 text-center card card-flat">
            <h5 class="fw-light">Chưa có đánh giá</h5>
            <p class="text-muted small mb-3">Hãy thuê xe và chia sẻ trải nghiệm của bạn.</p>
            <a th:href="@{/cars}" class="btn btn-minimal btn-sm px-4">Xem danh sách xe</a>
        </div>

        <div th:unless="${reviews == null or #lists.isEmpty(reviews)}" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
            <div th:each="r : ${reviews}" class="col">
                <div class="card card-flat h-100 review-card">
                    <div class="card-body d-flex flex-column">
                        <div class="review-stars mb-2" th:attr="aria-label=${r.reviewStar + ' sao'}">
                            <span th:each="i : ${#numbers.sequence(1, 5)}"
                                  th:classappend="${i <= r.reviewStar} ? ' star-on' : ' star-off'"
                                  class="review-star">★</span>
                        </div>
                        <p class="text-light mb-3 review-comment" th:text="${r.comment}">Comment</p>
                        <div class="mt-auto pt-2 border-top border-secondary border-opacity-25">
                            <div class="small text-white" th:text="${r.carRental != null and r.carRental.car != null ? r.carRental.car.carName : '—'}">Car</div>
                            <div class="small text-muted"
                                 th:text="${r.carRental != null and r.carRental.customer != null ? r.carRental.customer.fullName : 'Khách hàng'}">Customer</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div th:if="${totalPages > 1}" class="d-flex flex-wrap justify-content-between align-items-center gap-3 mt-4 pt-3 border-top border-secondary border-opacity-25">
            <div class="text-muted small">
                Trang <span th:text="${currentPage + 1}"></span> / <span th:text="${totalPages}"></span>
            </div>
            <nav aria-label="Page navigation">
                <ul class="pagination pagination-sm pagination-minimal mb-0 gap-1">
                    <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                        <a class="page-link" th:href="@{/reviews(page=0)}">&laquo;</a>
                    </li>
                    <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                        <a class="page-link" th:href="@{/reviews(page=${currentPage - 1})}">&lsaquo;</a>
                    </li>
                    <li class="page-item"
                        th:each="i : ${#numbers.sequence(T(java.lang.Math).max(0, currentPage - 2), T(java.lang.Math).min(totalPages - 1, currentPage + 2))}"
                        th:classappend="${currentPage == i} ? 'active'">
                        <a class="page-link" th:href="@{/reviews(page=${i})}" th:text="${i + 1}"></a>
                    </li>
                    <li class="page-item" th:classappend="${currentPage >= totalPages - 1} ? 'disabled'">
                        <a class="page-link" th:href="@{/reviews(page=${currentPage + 1})}">&rsaquo;</a>
                    </li>
                    <li class="page-item" th:classappend="${currentPage >= totalPages - 1} ? 'disabled'">
                        <a class="page-link" th:href="@{/reviews(page=${totalPages - 1})}">&raquo;</a>
                    </li>
                </ul>
            </nav>
        </div>
    </section>
</div>
</body>
</html>
