<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/admin-layout :: layout(title='Form xe', content=~{::content})}">
<body>
<div th:fragment="content">
    <h1 class="app-page-title mb-3" th:text="${carDTO.carId != null} ? 'Sửa xe' : 'Thêm xe mới'"></h1>
    <a th:href="@{/admin/cars}" class="btn-ghost mb-3 d-inline-block">&larr; Quay lại</a>

    <div class="card card-flat p-4">
        <div th:if="${error}" class="alert alert-danger border-0 rounded-1 text-center small mb-3" th:text="${error}"></div>
        <form th:action="@{/admin/cars/save}" th:object="${carDTO}" method="post" class="row g-3">
            <input type="hidden" th:field="*{carId}">
            
            <div class="col-md-6">
                <label class="form-label text-muted small mb-1">Tên xe</label>
                <input th:field="*{carName}" class="form-control input-minimal py-2"
                       th:classappend="${#fields.hasErrors('carName')} ? ' is-invalid' : ''">
                <div th:errors="*{carName}" class="text-danger small mt-1"></div>
            </div>
            <div class="col-md-6">
                <label class="form-label text-muted small mb-1">Hãng sản xuất</label>
                <select th:field="*{producerId}" class="form-select input-minimal py-2">
                    <option value="">-- Chọn hãng --</option>
                    <option th:each="p : ${producers}" th:value="${p.producerId}" th:text="${p.producerName}"></option>
                </select>
                <div th:errors="*{producerId}" class="text-danger small mt-1"></div>
            </div>

            <div class="col-md-4">
                <label class="form-label text-muted small mb-1">Năm sản xuất</label>
                <input type="number" th:field="*{carModelYear}" class="form-control input-minimal py-2">
                <div th:errors="*{carModelYear}" class="text-danger small mt-1"></div>
            </div>
            <div class="col-md-4">
                <label class="form-label text-muted small mb-1">Màu sắc</label>
                <input th:field="*{color}" class="form-control input-minimal py-2">
                <div th:errors="*{color}" class="text-danger small mt-1"></div>
            </div>
            <div class="col-md-4">
                <label class="form-label text-muted small mb-1">Sức chứa (chỗ)</label>
                <input type="number" th:field="*{capacity}" class="form-control input-minimal py-2">
                <div th:errors="*{capacity}" class="text-danger small mt-1"></div>
            </div>

            <div class="col-md-4">
                <label class="form-label text-muted small mb-1">Giá thuê ($/ngày)</label>
                <input type="number" step="1" min="1" th:field="*{rentPrice}" class="form-control input-minimal py-2">
                <div th:errors="*{rentPrice}" class="text-danger small mt-1"></div>
            </div>
            <div class="col-md-4">
                <label class="form-label text-muted small mb-1">Ngày nhập kho</label>
                <input type="date" th:field="*{importDate}" class="form-control input-minimal py-2"
                       th:max="${today}"
                       th:classappend="${#fields.hasErrors('importDate') or #fields.hasErrors('importOnOrAfterModelYear')} ? ' is-invalid' : ''">
                <div th:errors="*{importDate}" class="text-danger small mt-1"></div>
                <div th:errors="*{importOnOrAfterModelYear}" class="text-danger small mt-1"></div>
            </div>
            <div class="col-md-4">
                <label class="form-label text-muted small mb-1">Trạng thái hoạt động</label>
                <select th:field="*{status}" class="form-select input-minimal py-2">
                    <option value="Available">Available</option>
                    <option value="Rented">Rented</option>
                    <option value="Inactive">Inactive</option>
                </select>
            </div>

            <div class="col-12">
                <label class="form-label text-muted small mb-1">Mô tả chi tiết</label>
                <textarea th:field="*{description}" class="form-control input-minimal py-2" rows="3"></textarea>
                <div th:errors="*{description}" class="text-danger small mt-1"></div>
            </div>

            <div class="col-12 mt-4 text-end">
                <button type="submit" class="btn btn-minimal py-2 px-5">Lưu thông tin</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
