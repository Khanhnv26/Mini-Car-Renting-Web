<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/admin-layout :: layout(title='Quản lý xe', content=~{::content})}">
<body>
<div th:fragment="content" class="px-2">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="app-page-title mb-0">Quản lý xe</h1>
        <a th:href="@{/admin/cars/new}" class="btn btn-minimal py-2 px-4">+ Thêm xe mới</a>
    </div>

    <div class="card card-flat p-4 mb-4">
        <form th:action="@{/admin/cars}" method="get" class="row g-3">
            <div class="col-md-3">
                <input type="text" name="name" class="form-control form-control-sm" placeholder="Tên xe..." th:value="${name}" />
            </div>
            <div class="col-md-2">
                <select name="producerId" class="form-select form-select-sm">
                    <option value="">-- Tất cả Hãng --</option>
                    <option th:each="p : ${producers}" th:value="${p.producerId}" th:text="${p.producerName}" th:selected="${selectedProducerId != null && selectedProducerId == p.producerId}"></option>
                </select>
            </div>
            <div class="col-md-2">
                <select name="status" class="form-select form-select-sm">
                    <option value="">-- Trạng thái --</option>
                    <option value="Available" th:selected="${selectedStatus == 'Available'}">Sẵn sàng</option>
                    <option value="Rented" th:selected="${selectedStatus == 'Rented'}">Đang thuê</option>
                    <option value="Inactive" th:selected="${selectedStatus == 'Inactive'}">Ngừng hoạt động</option>
                </select>
            </div>
            <div class="col-md-2">
                <input type="number" name="minPrice" step="1" min="0" class="form-control form-control-sm" placeholder="Giá từ..." th:value="${minPrice}" />
            </div>
            <div class="col-md-2">
                <input type="number" name="maxPrice" step="1" min="0" class="form-control form-control-sm" placeholder="Giá đến..." th:value="${maxPrice}" />
            </div>
            <div class="col-md-1 d-grid">
                <button type="submit" class="btn btn-minimal py-1">Lọc</button>
            </div>
        </form>
    </div>
    
    <div class="card card-flat p-0 overflow-hidden">
        <div th:if="${cars == null or #lists.isEmpty(cars)}" class="empty-state">
            <h5 class="fw-light"
                th:text="${(name != null and !#strings.isEmpty(name)) or selectedProducerId != null or (selectedStatus != null and !#strings.isEmpty(selectedStatus)) or minPrice != null or maxPrice != null}
                    ? 'Không tìm thấy xe phù hợp' : 'Chưa có xe nào'">Chưa có xe nào</h5>
            <p class="text-muted small mb-0"
               th:text="${(name != null and !#strings.isEmpty(name)) or selectedProducerId != null or (selectedStatus != null and !#strings.isEmpty(selectedStatus)) or minPrice != null or maxPrice != null}
                    ? 'Thử đổi bộ lọc hoặc xóa điều kiện tìm kiếm.' : 'Hãy bấm nút Thêm xe mới để tạo dữ liệu đầu tiên.'">…</p>
        </div>
        
        <div th:unless="${cars == null or #lists.isEmpty(cars)}" class="table-responsive">
            <table class="table table-minimal mb-0">
                <thead>
                <tr>
                     <th class="text-muted" style="width: 4rem;">STT</th>
                     <th><a class="text-decoration-none text-dark" th:href="@{/admin/cars(page=${currentPage}, name=${name}, producerId=${selectedProducerId}, status=${selectedStatus}, minPrice=${minPrice}, maxPrice=${maxPrice}, sortBy='carName', sortDir=${reverseSortDir})}">Tên xe <span th:if="${sortBy == 'carName'}" th:text="${sortDir == 'asc' ? '↑' : '↓'}"></span></a></th>
                    <th><a class="text-decoration-none text-dark" th:href="@{/admin/cars(page=${currentPage}, name=${name}, producerId=${selectedProducerId}, status=${selectedStatus}, minPrice=${minPrice}, maxPrice=${maxPrice}, sortBy='carModelYear', sortDir=${reverseSortDir})}">Năm <span th:if="${sortBy == 'carModelYear'}" th:text="${sortDir == 'asc' ? '↑' : '↓'}"></span></a></th>
                    <th><a class="text-decoration-none text-dark" th:href="@{/admin/cars(page=${currentPage}, name=${name}, producerId=${selectedProducerId}, status=${selectedStatus}, minPrice=${minPrice}, maxPrice=${maxPrice}, sortBy='capacity', sortDir=${reverseSortDir})}">Sức chứa <span th:if="${sortBy == 'capacity'}" th:text="${sortDir == 'asc' ? '↑' : '↓'}"></span></a></th>
                    <th><a class="text-decoration-none text-dark" th:href="@{/admin/cars(page=${currentPage}, name=${name}, producerId=${selectedProducerId}, status=${selectedStatus}, minPrice=${minPrice}, maxPrice=${maxPrice}, sortBy='rentPrice', sortDir=${reverseSortDir})}">Giá thuê <span th:if="${sortBy == 'rentPrice'}" th:text="${sortDir == 'asc' ? '↑' : '↓'}"></span></a></th>
                    <th><a class="text-decoration-none text-dark" th:href="@{/admin/cars(page=${currentPage}, name=${name}, producerId=${selectedProducerId}, status=${selectedStatus}, minPrice=${minPrice}, maxPrice=${maxPrice}, sortBy='status', sortDir=${reverseSortDir})}">Trạng thái <span th:if="${sortBy == 'status'}" th:text="${sortDir == 'asc' ? '↑' : '↓'}"></span></a></th>
                    <th>Hãng</th>
                    <th class="text-end">Hành động</th>
                </tr>
                </thead>
                <tbody>
                 <tr th:each="car, iterStat : ${cars}">
                     <td class="text-muted" th:text="${currentPage * pageSize + iterStat.count}"></td>
                    <td th:text="${car.carName}"></td>
                    <td th:text="${car.carModelYear}"></td>
                    <td th:text="${car.capacity} + ' chỗ'"></td>
                    <td class="text-gold" th:text="${car.rentPrice} + '$'"></td>
                    <td>
                        <span th:if="${car.status == 'Available'}" class="badge badge-soft-gold py-2 px-3 rounded-pill">Sẵn sàng</span>
                        <span th:if="${car.status == 'Rented'}" class="badge badge-soft-gray py-2 px-3 rounded-pill">Đang thuê</span>
                        <span th:if="${car.status == 'Inactive'}" class="badge badge-soft-gray py-2 px-3 rounded-pill">Ngừng hoạt động</span>
                    </td>
                    <td th:text="${car.carProducer.producerName}"></td>
                    <td class="text-end">
                        <a th:href="@{/admin/cars/edit/{id}(id=${car.carId})}" class="btn btn-ghost px-2 text-muted">Sửa</a>
                        <button type="button" class="btn btn-ghost px-2 text-danger" 
                                data-bs-toggle="modal" data-bs-target="#deleteModal" 
                                th:attr="data-delete-url=@{/admin/cars/delete/{id}(id=${car.carId})}">
                            Xóa
                        </button>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        
        <div th:if="${totalPages > 1}" class="card-footer d-flex justify-content-between align-items-center py-3">
            <div class="text-muted small">
                Đang hiển thị dòng <span th:text="${currentPage * 5 + 1}"></span> - <span th:text="${T(java.lang.Math).min((currentPage + 1) * 5L, totalItems)}"></span> của tổng số <span th:text="${totalItems}"></span> dòng
            </div>
            <nav aria-label="Page navigation">
                <ul class="pagination pagination-sm pagination-minimal mb-0 gap-1">
                    <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                        <a class="page-link" th:href="@{/admin/cars(page=0, name=${name}, producerId=${selectedProducerId}, status=${selectedStatus}, minPrice=${minPrice}, maxPrice=${maxPrice}, sortBy=${sortBy}, sortDir=${sortDir})}" aria-label="First">&laquo;</a>
                    </li>
                    <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                        <a class="page-link" th:href="@{/admin/cars(page=${currentPage - 1}, name=${name}, producerId=${selectedProducerId}, status=${selectedStatus}, minPrice=${minPrice}, maxPrice=${maxPrice}, sortBy=${sortBy}, sortDir=${sortDir})}" aria-label="Previous">&lsaquo;</a>
                    </li>
                    <li class="page-item" th:each="i : ${#numbers.sequence(T(java.lang.Math).max(0, currentPage - 2), T(java.lang.Math).min(totalPages - 1, currentPage + 2))}" th:classappend="${currentPage == i} ? 'active'">
                        <a class="page-link" th:href="@{/admin/cars(page=${i}, name=${name}, producerId=${selectedProducerId}, status=${selectedStatus}, minPrice=${minPrice}, maxPrice=${maxPrice}, sortBy=${sortBy}, sortDir=${sortDir})}" th:text="${i + 1}"></a>
                    </li>
                    <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                        <a class="page-link" th:href="@{/admin/cars(page=${currentPage + 1}, name=${name}, producerId=${selectedProducerId}, status=${selectedStatus}, minPrice=${minPrice}, maxPrice=${maxPrice}, sortBy=${sortBy}, sortDir=${sortDir})}" aria-label="Next">&rsaquo;</a>
                    </li>
                    <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                        <a class="page-link" th:href="@{/admin/cars(page=${totalPages - 1}, name=${name}, producerId=${selectedProducerId}, status=${selectedStatus}, minPrice=${minPrice}, maxPrice=${maxPrice}, sortBy=${sortBy}, sortDir=${sortDir})}" aria-label="Last">&raquo;</a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>

    <div class="modal fade modal-glass" id="deleteModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content p-3 text-center">
                <div class="modal-body">
                    <h5 class="fw-light mb-3">Xóa dữ liệu?</h5>
                    <p class="text-muted small">Hành động này không thể hoàn tác. Bạn có chắc chắn muốn xóa?</p>
                </div>
                <div class="d-flex justify-content-center gap-2 pb-2">
                    <button type="button" class="btn btn-ghost px-4" data-bs-dismiss="modal">Hủy</button>
                    <a href="#" id="confirmDeleteBtn" class="btn btn-minimal px-4 bg-danger">Xóa luôn</a>
                </div>
            </div>
        </div>
    </div>
    
</div>
</body>
</html>
