<div th:fragment="toast">
    <div th:if="${toastMessage}" class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 1080;">
        <div class="toast show align-items-center border-0"
             th:classappend="${toastType == 'error'} ? 'text-bg-danger' : (${toastType == 'warning'} ? 'text-bg-warning' : 'text-bg-success')">
            <div class="d-flex">
                <div class="toast-body" th:text="${toastMessage}"></div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        </div>
    </div>
</div>
