<div th:fragment="toast">
    <div th:if="${toastMessage}" class="toast-container position-fixed bottom-0 end-0 p-4" style="z-index: 1080;">
        <div id="liveToast" class="toast toast-minimal align-items-center" role="alert" aria-live="assertive" aria-atomic="true" data-bs-delay="4000">
            <div class="d-flex">
                <div class="toast-body d-flex align-items-center gap-2" th:classappend="${toastType == 'error'} ? 'text-danger' : (${toastType == 'warning'} ? 'text-warning' : 'text-gold')">
                    <span th:text="${toastMessage}" class="text-dark fw-medium"></span>
                </div>
                <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    </div>
    
    <script th:if="${toastMessage}">
        document.addEventListener('DOMContentLoaded', function () {
            var toastElList = [].slice.call(document.querySelectorAll('.toast'));
            var toastList = toastElList.map(function (toastEl) {
                return new bootstrap.Toast(toastEl);
            });
            toastList.forEach(toast => toast.show());
        });
    </script>
</div>
