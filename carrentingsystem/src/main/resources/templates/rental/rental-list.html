<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/admin-layout :: layout(title='Quản lý giao dịch', content=~{::content})}">
<body>
<div th:fragment="content" class="px-2">
    <div class="mb-4">
        <h4 class="fw-light mb-0">Danh sách giao dịch thuê</h4>
    </div>

    <div class="card card-flat p-4 mb-4">
        <form th:action="@{/admin/rentals}" method="get" class="row g-3">
            <div class="col-md-3">
                <select name="status" class="form-select form-select-sm">
                    <option value="">-- Trạng thái --</option>
                    <option value="Pending" th:selected="${selectedStatus == 'Pending'}">Chờ xử lý</option>
                    <option value="Renting" th:selected="${selectedStatus == 'Renting'}">Đang thuê</option>
                    <option value="Completed" th:selected="${selectedStatus == 'Completed'}">Đã hoàn thành</option>
                    <option value="Cancelled" th:selected="${selectedStatus == 'Cancelled'}">Đã hủy</option>
                </select>
            </div>
            <div class="col-md-3">
                <input type="date" name="startDate" class="form-control form-control-sm" placeholder="Từ ngày..." th:value="${startDate}" />
            </div>
            <div class="col-md-3">
                <input type="date" name="endDate" class="form-control form-control-sm" placeholder="Đến ngày..." th:value="${endDate}" />
            </div>
            <div class="col-md-2 d-grid">
                <button type="submit" class="btn btn-minimal py-1">Lọc</button>
            </div>
        </form>
    </div>
    
    <div class="card card-flat p-0 overflow-hidden">
        <div th:if="${#lists.isEmpty(rentals)}" class="empty-state">
            <h5 class="fw-light">Chưa có giao dịch nào</h5>
            <p class="text-muted small mb-0">Khi khách hàng đặt thuê xe, danh sách sẽ xuất hiện tại đây.</p>
        </div>
        
        <div th:unless="${#lists.isEmpty(rentals)}" class="table-responsive">
            <table class="table table-minimal mb-0">
                <thead>
                <tr>
                    <th><a class="text-decoration-none text-dark" th:href="@{/admin/rentals(page=${currentPage}, status=${selectedStatus}, startDate=${startDate}, endDate=${endDate}, sortBy='carRentID', sortDir=${reverseSortDir})}">ID <span th:if="${sortBy == 'carRentID'}" th:text="${sortDir == 'asc' ? '↑' : '↓'}"></span></a></th>
                    <th>Khách hàng</th>
                    <th>Xe</th>
                    <th><a class="text-decoration-none text-dark" th:href="@{/admin/rentals(page=${currentPage}, status=${selectedStatus}, startDate=${startDate}, endDate=${endDate}, sortBy='pickUpDate', sortDir=${reverseSortDir})}">Ngày nhận <span th:if="${sortBy == 'pickUpDate'}" th:text="${sortDir == 'asc' ? '↑' : '↓'}"></span></a></th>
                    <th><a class="text-decoration-none text-dark" th:href="@{/admin/rentals(page=${currentPage}, status=${selectedStatus}, startDate=${startDate}, endDate=${endDate}, sortBy='returnDate', sortDir=${reverseSortDir})}">Ngày trả <span th:if="${sortBy == 'returnDate'}" th:text="${sortDir == 'asc' ? '↑' : '↓'}"></span></a></th>
                    <th><a class="text-decoration-none text-dark" th:href="@{/admin/rentals(page=${currentPage}, status=${selectedStatus}, startDate=${startDate}, endDate=${endDate}, sortBy='rentPrice', sortDir=${reverseSortDir})}">Giá <span th:if="${sortBy == 'rentPrice'}" th:text="${sortDir == 'asc' ? '↑' : '↓'}"></span></a></th>
                    <th><a class="text-decoration-none text-dark" th:href="@{/admin/rentals(page=${currentPage}, status=${selectedStatus}, startDate=${startDate}, endDate=${endDate}, sortBy='status', sortDir=${reverseSortDir})}">Trạng thái <span th:if="${sortBy == 'status'}" th:text="${sortDir == 'asc' ? '↑' : '↓'}"></span></a></th>
                    <th class="text-end">Cập nhật</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="r : ${rentals}">
                    <td class="text-muted" th:text="${r.carRentID}"></td>
                    <td class="fw-medium" th:text="${r.customer.fullName}"></td>
                    <td th:text="${r.car.carName}"></td>
                    <td th:text="${r.pickUpDate}"></td>
                    <td th:text="${r.returnDate}"></td>
                    <td class="text-gold fw-medium" th:text="${r.rentPrice} + '$'"></td>
                    <td>
                        <span th:if="${r.status == 'Pending'}" class="badge badge-soft-gold py-2 px-3 rounded-pill">Chờ xử lý</span>
                        <span th:if="${r.status == 'Renting'}" class="badge badge-soft-blue py-2 px-3 rounded-pill">Đang thuê</span>
                        <span th:if="${r.status == 'Completed'}" class="badge badge-soft-green py-2 px-3 rounded-pill">Đã hoàn thành</span>
                        <span th:if="${r.status == 'Cancelled'}" class="badge badge-soft-gray py-2 px-3 rounded-pill">Đã hủy</span>
                    </td>
                    <td class="text-end action-cell">
                        <div th:if="${r.status != 'Completed' and r.status != 'Cancelled'}">
                            <form th:action="@{/admin/rentals/status/{id}(id=${r.carRentID})}" method="post" class="d-flex gap-2 justify-content-end align-items-center">
                                <select name="status" class="form-select input-minimal py-1 px-2" style="width: auto; font-size: 0.85rem;">
                                    <option value="Pending" th:selected="${r.status == 'Pending'}">Pending</option>
                                    <option value="Renting" th:selected="${r.status == 'Renting'}">Renting</option>
                                    <option value="Completed" th:selected="${r.status == 'Completed'}">Completed</option>
                                    <option value="Cancelled" th:selected="${r.status == 'Cancelled'}">Cancelled</option>
                                </select>
                                <button type="submit" class="btn btn-minimal py-1 px-3" style="font-size: 0.85rem;">Lưu</button>
                            </form>
                        </div>
                        <span th:if="${r.status == 'Completed' or r.status == 'Cancelled'}" class="text-muted" style="opacity: 0.4;">—</span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        
        <div th:if="${totalPages > 1}" class="card-footer bg-white d-flex justify-content-between align-items-center py-3">
            <div class="text-muted small">
                Đang hiển thị dòng <span th:text="${currentPage * 5 + 1}"></span> - <span th:text="${T(java.lang.Math).min((currentPage + 1) * 5, totalItems)}"></span> của tổng số <span th:text="${totalItems}"></span> dòng
            </div>
            <nav aria-label="Page navigation">
                <ul class="pagination pagination-sm pagination-minimal mb-0">
                    <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                        <a class="page-link" th:href="@{/admin/rentals(page=0, status=${selectedStatus}, startDate=${startDate}, endDate=${endDate}, sortBy=${sortBy}, sortDir=${sortDir})}">Đầu</a>
                    </li>
                    <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                        <a class="page-link" th:href="@{/admin/rentals(page=${currentPage - 1}, status=${selectedStatus}, startDate=${startDate}, endDate=${endDate}, sortBy=${sortBy}, sortDir=${sortDir})}">Trước</a>
                    </li>
                    <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}" th:classappend="${currentPage == i} ? 'active'">
                        <a class="page-link" th:href="@{/admin/rentals(page=${i}, status=${selectedStatus}, startDate=${startDate}, endDate=${endDate}, sortBy=${sortBy}, sortDir=${sortDir})}" th:text="${i + 1}"></a>
                    </li>
                    <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                        <a class="page-link" th:href="@{/admin/rentals(page=${currentPage + 1}, status=${selectedStatus}, startDate=${startDate}, endDate=${endDate}, sortBy=${sortBy}, sortDir=${sortDir})}">Sau</a>
                    </li>
                    <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                        <a class="page-link" th:href="@{/admin/rentals(page=${totalPages - 1}, status=${selectedStatus}, startDate=${startDate}, endDate=${endDate}, sortBy=${sortBy}, sortDir=${sortDir})}">Cuối</a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
</div>
</body>
</html>
