<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/admin-layout :: layout(title='Quản lý giao dịch', content=~{::content})}">
<body>
<div th:fragment="content" class="px-2">
    <div class="mb-4">
        <h4 class="fw-light mb-0">Danh sách giao dịch thuê</h4>
    </div>
    
    <div class="card card-flat p-0 overflow-hidden">
        <div th:if="${#lists.isEmpty(rentals)}" class="empty-state">
            <h5 class="fw-light">Chưa có giao dịch nào</h5>
            <p class="text-muted small mb-0">Khi khách hàng đặt thuê xe, danh sách sẽ xuất hiện tại đây.</p>
        </div>
        
        <div th:unless="${#lists.isEmpty(rentals)}" class="table-responsive">
            <table class="table table-minimal mb-0">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Khách hàng</th>
                    <th>Xe</th>
                    <th>Ngày nhận</th>
                    <th>Ngày trả</th>
                    <th>Giá</th>
                    <th>Trạng thái</th>
                    <th class="text-end">Cập nhật</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="r : ${rentals}">
                    <td class="text-muted" th:text="${r.carRentID}"></td>
                    <td class="fw-medium" th:text="${r.customer.fullName}"></td>
                    <td th:text="${r.car.carName}"></td>
                    <td th:text="${r.pickUpDate}"></td>
                    <td th:text="${r.returnDate}"></td>
                    <td class="text-gold fw-medium" th:text="${r.rentPrice} + '$'"></td>
                    <td>
                        <span th:if="${r.status == 'Pending'}" class="badge badge-soft-gold py-2 px-3 rounded-pill">Chờ xử lý</span>
                        <span th:if="${r.status == 'Renting'}" class="badge badge-soft-gold py-2 px-3 rounded-pill">Đang thuê</span>
                        <span th:if="${r.status == 'Completed'}" class="badge badge-soft-gray py-2 px-3 rounded-pill">Đã hoàn thành</span>
                        <span th:if="${r.status == 'Cancelled'}" class="badge badge-soft-gray py-2 px-3 rounded-pill">Đã hủy</span>
                    </td>
                    <td class="text-end">
                        <div th:if="${r.status != 'Completed' and r.status != 'Cancelled'}">
                            <form th:action="@{/admin/rentals/status/{id}(id=${r.carRentID})}" method="post" class="d-flex gap-2 justify-content-end align-items-center">
                                <select name="status" class="form-select input-minimal py-1 px-2" style="width: auto;">
                                    <option value="Pending" th:selected="${r.status == 'Pending'}">Pending</option>
                                    <option value="Renting" th:selected="${r.status == 'Renting'}">Renting</option>
                                    <option value="Completed" th:selected="${r.status == 'Completed'}">Completed</option>
                                    <option value="Cancelled" th:selected="${r.status == 'Cancelled'}">Cancelled</option>
                                </select>
                                <button type="submit" class="btn btn-minimal py-1 px-3">Lưu</button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
