<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/admin-layout :: layout(title='Báo cáo giao dịch', content=~{::content})}">
<body>
<div th:fragment="content">
    <h1 class="h5 fw-normal mb-3">Báo cáo giao dịch</h1>
    <a th:href="@{/admin/rentals}" class="btn-ghost mb-3 d-inline-block">&larr; Quay lại</a>

    <div class="card card-flat p-4 mb-4">
        <form th:action="@{/admin/rentals/report}" method="post" class="row g-3 align-items-end">
            <div class="col-md-4">
                <label class="form-label text-muted small mb-1">Từ ngày</label>
                <input type="date" name="startDate" class="form-control input-minimal py-2" th:value="${startDate}">
            </div>
            <div class="col-md-4">
                <label class="form-label text-muted small mb-1">Đến ngày</label>
                <input type="date" name="endDate" class="form-control input-minimal py-2" th:value="${endDate}">
            </div>
            <div class="col-md-4">
                <button type="submit" class="btn btn-minimal py-2 px-4">Xem báo cáo</button>
            </div>
        </form>
    </div>

    <div th:if="${rentals != null and !rentals.isEmpty()}">
        <table class="table table-minimal">
            <thead>
            <tr>
                <th>ID</th>
                <th>Khách hàng</th>
                <th>Xe</th>
                <th>Ngày nhận</th>
                <th>Ngày trả</th>
                <th>Giá</th>
                <th>Trạng thái</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="r : ${rentals}">
                <td th:text="${r.carRentId}"></td>
                <td th:text="${r.customerName}"></td>
                <td th:text="${r.carName}"></td>
                <td th:text="${r.pickupDate}"></td>
                <td th:text="${r.returnDate}"></td>
                <td class="text-gold" th:text="${r.rentPrice}"></td>
                <td th:text="${r.status}"></td>
            </tr>
            </tbody>
        </table>
    </div>
    <p th:if="${rentals != null and rentals.isEmpty()}" class="text-muted small">Không có giao dịch trong khoảng thời gian này.</p>
</div>
</body>
</html>
