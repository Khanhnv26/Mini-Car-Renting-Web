<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Báo cáo giao dịch</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<h1>Báo cáo giao dịch theo khoảng thời gian</h1>
<a th:href="@{/admin/rentals}">← Quay lại</a><br/><br/>

<form th:action="@{/admin/rentals/report}" method="post">
    <div>Từ ngày: <input type="date" name="startDate" th:value="${startDate}"/></div><br/>
    <div>Đến ngày: <input type="date" name="endDate" th:value="${endDate}"/></div><br/>
    <button type="submit">Xem báo cáo</button>
</form>
<hr/>
<table border="1" th:if="${rentals != null and !rentals.isEmpty()}">
    <thead>
    <tr>
        <th>ID</th>
        <th>Khách hàng</th>
        <th>Xe</th>
        <th>Ngày nhận</th>
        <th>Ngày trả</th>
        <th>Giá (giảm dần)</th>
        <th>Trạng thái</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="r : ${rentals}">
        <td th:text="${r.carRentID}"></td>
        <td th:text="${r.customer.fullName}"></td>
        <td th:text="${r.car.carName}"></td>
        <td th:text="${r.pickUpDate}"></td>
        <td th:text="${r.returnDate}"></td>
        <td th:text="${r.rentPrice}"></td>
        <td th:text="${r.status}"></td>
    </tr>
    </tbody>
</table>
<p th:if="${rentals != null and rentals.isEmpty()}">Không có giao dịch trong khoảng thời gian này.</p>
</body>
</html>
