<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/admin-layout :: layout(title='Quản lý hãng xe', content=~{::content})}">
<body>
<div th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h4">Danh sách hãng xe</h1>
        <a th:href="@{/admin/producers/new}" class="btn btn-primary btn-sm">+ Thêm mới</a>
    </div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <table class="table table-bordered table-hover">
        <thead class="table-light">
        <tr>
            <th>ID</th>
            <th>Tên hãng</th>
            <th>Địa chỉ</th>
            <th>Quốc gia</th>
            <th>Hành động</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="p : ${producers}">
            <td th:text="${p.producerId}"></td>
            <td th:text="${p.producerName}"></td>
            <td th:text="${p.address}"></td>
            <td th:text="${p.country}"></td>
            <td>
                <a th:href="@{/admin/producers/edit/{id}(id=${p.producerId})}" class="btn btn-sm btn-outline-primary">Sửa</a>
                <a th:href="@{/admin/producers/delete/{id}(id=${p.producerId})}" class="btn btn-sm btn-outline-danger"
                   onclick="return confirm('Bạn chắc chắn?')">Xóa</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
