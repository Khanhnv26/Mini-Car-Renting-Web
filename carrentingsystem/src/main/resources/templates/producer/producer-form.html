<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/admin-layout :: layout(title='Form hãng xe', content=~{::content})}">
<body>
<div th:fragment="content">
    <h1 class="h4 mb-3" th:text="${producerDTO.producerId != null} ? 'Sửa hãng xe' : 'Thêm hãng xe'"></h1>
    <a th:href="@{/admin/producers}" class="btn btn-outline-secondary btn-sm mb-3">&larr; Quay lại</a>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <form th:action="@{/admin/producers/save}" th:object="${producerDTO}" method="post" class="row g-3">
        <input type="hidden" th:field="*{producerId}">
        <div class="col-md-6">
            <label class="form-label">Tên hãng</label>
            <input th:field="*{producerName}" class="form-control">
            <div th:errors="*{producerName}" class="text-danger small"></div>
        </div>
        <div class="col-md-6">
            <label class="form-label">Địa chỉ</label>
            <input th:field="*{address}" class="form-control">
            <div th:errors="*{address}" class="text-danger small"></div>
        </div>
        <div class="col-md-6">
            <label class="form-label">Quốc gia</label>
            <input th:field="*{country}" class="form-control">
            <div th:errors="*{country}" class="text-danger small"></div>
        </div>
        <div class="col-12">
            <button type="submit" class="btn btn-primary">Lưu</button>
        </div>
    </form>
</div>
</body>
</html>
