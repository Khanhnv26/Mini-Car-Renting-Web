<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/admin-layout :: layout(title='Form hãng xe', content=~{::content})}">
<body>
<div th:fragment="content">
    <h1 class="app-page-title mb-3" th:text="${producerDTO.producerId != null} ? 'Sửa hãng xe' : 'Thêm hãng xe'"></h1>
    <a th:href="@{/admin/producers}" class="btn-ghost mb-3 d-inline-block">&larr; Quay lại</a>
    <div th:if="${error}" class="alert alert-danger border-0 rounded-0 small" th:text="${error}"></div>

    <div class="card card-flat p-4">
        <form th:action="@{/admin/producers/save}" th:object="${producerDTO}" method="post" class="row g-3">
            <input type="hidden" th:field="*{producerId}">
            <div class="col-md-6">
                <label class="form-label text-muted small mb-1">Tên hãng</label>
                <input th:field="*{producerName}" class="form-control input-minimal py-2">
                <div th:errors="*{producerName}" class="text-danger small mt-1"></div>
            </div>
            <div class="col-md-6">
                <label class="form-label text-muted small mb-1">Địa chỉ</label>
                <input th:field="*{address}" class="form-control input-minimal py-2">
                <div th:errors="*{address}" class="text-danger small mt-1"></div>
            </div>
            <div class="col-md-6">
                <label class="form-label text-muted small mb-1">Quốc gia</label>
                <input th:field="*{country}" class="form-control input-minimal py-2">
                <div th:errors="*{country}" class="text-danger small mt-1"></div>
            </div>
            <div class="col-12 mt-4">
                <button type="submit" class="btn btn-minimal py-2 px-5">Lưu</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
