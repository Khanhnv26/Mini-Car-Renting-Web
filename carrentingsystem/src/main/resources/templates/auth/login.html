<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/auth-layout :: layout(title='Đăng nhập', content=~{::content})}">
<body>
<div th:fragment="content">
    <div th:if="${param.error}" class="alert alert-danger border-0 rounded-0 text-center small">Sai email hoặc mật khẩu!</div>
    <div th:if="${param.logout}" class="alert alert-success border-0 rounded-0 text-center small">Đã đăng xuất!</div>
    <div th:if="${param.registered}" class="alert alert-success border-0 rounded-0 text-center small">Đăng ký thành công!</div>

    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label class="form-label text-muted small mb-1">Email</label>
            <input type="email" name="username" class="form-control input-minimal py-2" required>
        </div>
        <div class="mb-3">
            <label class="form-label text-muted small mb-1">Mật khẩu</label>
            <input type="password" name="password" class="form-control input-minimal py-2" required>
        </div>
        <button type="submit" class="btn btn-minimal w-100 py-2">Đăng nhập</button>
    </form>
    <div class="text-center mt-4">
        <a th:href="@{/register}" class="text-muted small">Chưa có tài khoản? <span class="text-gold">Đăng ký</span></a>
    </div>
</div>
</body>
</html>
