<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/auth-layout :: layout(title='Đăng nhập', content=~{::content})}">
<body>
<div th:fragment="content">
    <div th:if="${param.error}" class="alert alert-danger">Sai email hoặc mật khẩu!</div>
    <div th:if="${param.logout}" class="alert alert-success">Đã đăng xuất!</div>
    <div th:if="${param.registered}" class="alert alert-success">Đăng ký thành công!</div>

    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" name="username" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Mật khẩu</label>
            <input type="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Đăng nhập</button>
    </form>
    <p class="text-center mt-3"><a th:href="@{/register}">Chưa có tài khoản? Đăng ký</a></p>
</div>
</body>
</html>
