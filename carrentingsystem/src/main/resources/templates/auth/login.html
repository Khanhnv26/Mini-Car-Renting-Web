<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/auth-layout :: layout(title='Đăng nhập', content=~{::content})}">
<body>
<div th:fragment="content">
    <h1 class="h5 fw-light text-center text-white mb-1">Đăng nhập</h1>
    <p class="text-muted small text-center mb-4">Đăng nhập để thuê xe</p>

    <div th:if="${param.error}" class="alert alert-danger border-0 rounded-1 text-center small">Sai email hoặc mật khẩu!</div>
    <div th:if="${param.logout}" class="alert alert-success border-0 rounded-1 text-center small">Đã đăng xuất!</div>
    <div th:if="${param.registered}" class="alert alert-success border-0 rounded-1 text-center small">Đăng ký thành công! Vui lòng đăng nhập.</div>

    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label class="form-label text-muted small mb-1">Email</label>
            <input type="email" name="username" class="form-control input-minimal py-2" placeholder="you@example.com" required autofocus>
        </div>
        <div class="mb-3">
            <label class="form-label text-muted small mb-1">Mật khẩu</label>
            <input type="password" name="password" class="form-control input-minimal py-2" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-minimal w-100 py-2">Đăng nhập</button>
    </form>
    <div class="text-center mt-4 d-flex flex-column gap-2">
        <a th:href="@{/register}" class="text-muted small text-decoration-none">Chưa có tài khoản? <span class="text-gold">Đăng ký</span></a>
        <a th:href="@{/}" class="text-muted small text-decoration-none opacity-75">← Về trang chủ</a>
    </div>
</div>
</body>
</html>
